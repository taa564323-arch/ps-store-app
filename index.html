<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الألعاب - PS Store</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #00e676;
            margin-bottom: 30px;
        }
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .game-card {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s;
        }
        .game-card:hover {
            transform: translateY(-5px);
        }
        .game-card img {
            width: 100%;
            height: 260px;
            object-fit: cover;
            border-radius: 8px;
        }
        .game-card h3 {
            margin: 15px 0 10px;
            font-size: 18px;
        }
        .download-btn {
            background-color: #00e676;
            border: none;
            padding: 12px 20px;
            color: #000000;
            font-weight: bold;
            font-size: 15px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        .download-btn:hover {
            background-color: #00c853;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            overflow-y: auto;
            padding: 15px;
            box-sizing: border-box;
        }
        .modal-content {
            background: #252525;
            padding: 22px;
            border-radius: 12px;
            text-align: center;
            width: 100%;
            max-width: 450px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.7);
        }
        .choice-question {
            background: #1b2838;
            border-right: 4px solid #00e676;
            padding: 10px 12px;
            border-radius: 6px;
            margin: 10px 0 14px;
            font-size: 15px;
            font-weight: bold;
            color: #e0f7fa;
        }
        .modal-preview-img {
            width: 100%;
            max-height: 180px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .video-box {
            margin: 12px 0;
            background: #181818;
            padding: 8px;
            border-radius: 8px;
        }
        .video-box video,
        .video-box iframe {
            width: 100%;
            height: 200px;
            border: none;
            border-radius: 6px;
        }
        .ad-box {
            background: #333333;
            border: 1px dashed #ffd54f;
            padding: 12px;
            margin: 15px 0;
            border-radius: 8px;
            color: #ffd54f;
            font-size: 14px;
        }
        .link-btn {
            display: block;
            width: 100%;
            box-sizing: border-box;
            margin: 10px 0;
            background: #007acc;
            color: white;
            text-decoration: none;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .link-btn:hover {
            background: #005999;
        }
        .our-app-btn {
            background: #00a86b;
        }
        .our-app-btn:hover {
            background: #008554;
        }
        .ps-btn {
            background: #00439c;
        }
        .ps-btn:hover {
            background: #003070;
        }
        .close-btn {
            background: #ff5252;
            border: none;
            padding: 10px 20px;
            color: white;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }
    </style>
</head>
<body>

    <h1>منصة الألعاب</h1>
    <div class="game-grid" id="gameGrid"></div>

    <div class="modal" id="downloadModal">
        <div class="modal-content">
            <h3 id="modalTitle">اسم اللعبة</h3>
            <div class="choice-question" id="choiceQuestion">
                تريد تنزلها من هذا التطبيق، لو من التطبيق الثاني، لو من تطبيقنا؟
            </div>

            <img id="modalImage" class="modal-preview-img" src="" alt="">

            <!-- الفيديو التوضيحي للعبة -->
            <div class="video-box" id="videoContainer"></div>

            <!-- مساحة الإعلان ودعم المطور -->
            <div class="ad-box" id="adContainer">
                <p style="margin: 0 0 5px;"><strong>ادعم المطور لاستمرار المنصة ❤️</strong></p>
                <small>ضع كود إعلانك هنا (AdSense / Adsterra / إعلان مباشر)</small>
            </div>

            <!-- خيارات التحميل التلقائية غير المحدودة -->
            <div id="linksContainer"></div>

            <button class="close-btn" onclick="closeModal()">إغلاق</button>
        </div>
    </div>

    <script>
        const games = [
            {
                name: 'God of War Ragnarök',
                image: 'https://image.api.playstation.com/vulcan/ap/rnd/202207/1210/4M1jnSSzHNZnqjDA6XqOIVzD.png',
                video: 'https://www.youtube.com/embed/EE-4Gvwhsle',
                links: [
                    { name: 'تنزيل من تطبيقنا المباشر', url: 'https://example.com/our-app/gow', style: 'our-app' },
                    { name: 'تنزيل من التطبيق الأول (AMD)', url: 'https://example.com/amd/gow' },
                    { name: 'تنزيل من التطبيق الثاني (AD1)', url: 'https://example.com/ad1/gow' },
                    { name: 'إرسال إلى PlayStation مباشرة', type: 'ps4' },
                    { name: 'خيار تحميل إضافي 4', url: 'https://example.com/extra4/gow' }
                ]
            },
            {
                name: 'Grand Theft Auto V',
                image: 'https://image.api.playstation.com/vulcan/ap/rnd/202205/1116/CQxDAciUKvM1ezbTqpPqiH40.png',
                video: 'https://www.youtube.com/embed/QkkoHAzjnUs',
                links: [
                    { name: 'تنزيل من تطبيقنا المباشر', url: 'https://example.com/our-app/gtav', style: 'our-app' },
                    { name: 'تنزيل من التطبيق الأول (AMD)', url: 'https://example.com/amd/gtav' },
                    { name: 'تنزيل من التطبيق الثاني (AD1)', url: 'https://example.com/ad1/gtav' },
                    { name: 'إرسال إلى PlayStation مباشرة', type: 'ps4' }
                ]
            }
        ];

        function renderGames() {
            const grid = document.getElementById('gameGrid');
            grid.innerHTML = '';
            games.forEach((game, index) => {
                grid.innerHTML += `
                    <div class="game-card">
                        <img src="${game.image}" alt="${game.name}">
                        <h3>${game.name}</h3>
                        <button class="download-btn" onclick="openModal(${index})">تنزيل</button>
                    </div>
                `;
            });
        }

        function renderVideo(videoUrl) {
            const videoBox = document.getElementById('videoContainer');
            if (!videoUrl) {
                videoBox.style.display = 'none';
                videoBox.innerHTML = '';
                return;
            }
            videoBox.style.display = 'block';
            if (videoUrl.includes('youtube.com/embed/') || videoUrl.includes('youtu.be/')) {
                const embedUrl = videoUrl.replace('youtu.be/', 'www.youtube.com/embed/');
                videoBox.innerHTML = `<iframe src="${embedUrl}" allowfullscreen></iframe>`;
            } else {
                videoBox.innerHTML = `<video src="${videoUrl}" controls playsinline></video>`;
            }
        }

        function openModal(index) {
            const game = games[index];
            document.getElementById('modalTitle').innerText = game.name;
            document.getElementById('choiceQuestion').innerText =
                `لعبة "${game.name}": تريد تنزلها من هذا التطبيق، لو من التطبيق الثاني، لو من تطبيقنا؟`;

            const modalImg = document.getElementById('modalImage');
            modalImg.src = game.image;
            modalImg.alt = game.name;

            renderVideo(game.video);

            const container = document.getElementById('linksContainer');
            container.innerHTML = '';

            game.links.forEach(link => {
                if (link.type === 'ps4') {
                    container.innerHTML += `
                        <button onclick="promptIp('${game.name}')" class="link-btn ps-btn">
                            ${link.name}
                        </button>`;
                } else {
                    const extraClass = link.style === 'our-app' ? 'our-app-btn' : '';
                    container.innerHTML += `
                        <a href="${link.url}" class="link-btn ${extraClass}" target="_blank">
                            ${link.name}
                        </a>`;
                }
            });

            document.getElementById('downloadModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('videoContainer').innerHTML = '';
            document.getElementById('downloadModal').style.display = 'none';
        }

        function promptIp(gameName) {
            const ip = prompt(`أدخل عنوان IP الخاص بجهاز PlayStation لإرسال لعبة ${gameName} (مثال: 192.168.1.100):`);
            if (ip) {
                alert(`جاري إرسال ${gameName} إلى جهاز PlayStation على العنوان: ${ip}`);
                closeModal();
            }
        }

        renderGames();
    </script>
</body>
</html>
